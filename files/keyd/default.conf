# Mac-style keyboard for a PC keyboard (keyd, system-wide incl. login screen)
#
# Physical key (PC)        ->  behaves like (Mac)
#   Alt  (next to space)   ->  Cmd   (Cmd+C/V/X/Z/A/T/W/Q/F/S... = copy, paste, etc.)
#   Win                    ->  Option (Alt)
#   Ctrl                   ->  Ctrl  (unchanged; Ctrl+C still interrupts in a terminal)
#   Caps Lock              ->  Super (COSMIC launcher, tiling, workspaces)
#
# Test a change without rebuilding the image:
#   sudo cp this-file /etc/keyd/default.conf && sudo keyd reload
# See key events: sudo keyd monitor

[ids]
*

[main]
leftalt = layer(cmd)
leftmeta = layer(alt)
capslock = layer(meta)

# "Cmd" layer. Inherits Ctrl, so any key not listed here is sent as Ctrl+key
# (Cmd+T = Ctrl+T new tab, Cmd+W close tab, Cmd+Q quit, Cmd+F find, ...).
[cmd:C]

# Clipboard via Ctrl/Shift+Insert, which also works in terminals,
# so Cmd+C copies there instead of interrupting.
c = C-insert
v = S-insert
x = S-delete

# Cmd+Space: open the COSMIC launcher (a tap of Super)
space = macro(leftmeta)

# Cmd+arrows: start/end of line, top/bottom of document
left = home
right = end
up = C-home
down = C-end

# Cmd+Backspace: delete to start of line
backspace = macro(S-home backspace)

# Cmd+Tab: switch windows (Alt+Tab in COSMIC); keep Cmd held and tap Tab
# to move on, Cmd+Shift+Tab to go back.
tab = swapm(app_switch, A-tab)

[app_switch:A]
tab = A-tab
